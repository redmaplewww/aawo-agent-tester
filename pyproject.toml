[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent-tester"
version = "0.1.0.dev0"
description = "Evidence-first Codex-powered customer simulation and Agent completeness tester"
requires-python = ">=3.10"
dependencies = ["openai-codex==0.147.0"]

[project.scripts]
codex-agent-tester = "codex_agent_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
