[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aawo-agent-tester"
version = "0.1.0.dev0"
description = "Evidence-first Agent understanding and customer simulation tester for AAWO"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
aawo = ["aawo==0.6.0.dev41"]

[project.scripts]
aawo-agent-tester = "aawo_agent_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
